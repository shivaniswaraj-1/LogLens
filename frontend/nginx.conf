server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Same-origin API proxy so the frontend's relative /api/* calls reach the
  # backend container when both run behind this nginx (docker-compose).
  # If the frontend is deployed to a separate host from the backend, skip
  # this and set VITE_API_BASE_URL at build time instead.
  location /api/ {
    proxy_pass http://backend:4000/api/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
  }

  location / {
    try_files $uri /index.html;
  }
}
